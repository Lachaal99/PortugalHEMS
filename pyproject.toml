[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-energy-rl"
version = "0.1.0"
description = "Home Energy Management System (HEMS) using Reinforcement Learning with SAC agent"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Amine", email = "amine@example.com"}
]
license = {text = "MIT"}
keywords = ["reinforcement-learning", "energy-management", "hems", "sac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",                    # Deep learning framework
    "numpy>=1.24.0",                   # Numerical computing
    "pandas>=2.0.0",                   # Data manipulation
    "pyyaml>=6.0",                     # YAML config parsing
    "matplotlib>=3.7.0",               # Data visualization
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",                   # Testing framework
    "black>=23.0.0",                   # Code formatter
    "flake8>=6.0.0",                   # Linter
    "isort>=5.12.0",                   # Import sorter
    "mypy>=1.0.0",                     # Type checker
]

jupyter = [
    "jupyter>=1.0.0",                  # Jupyter notebooks
    "ipython>=8.0.0",                  # IPython shell
    "notebook>=6.5.0",                 # Classic notebook
]

[project.urls]
Homepage = "https://github.com/yourusername/home-energy-rl"
Repository = "https://github.com/yourusername/home-energy-rl.git"
Issues = "https://github.com/yourusername/home-energy-rl/issues"

[tool.setuptools]
packages = ["hems_core", "hems_core.env", "hems_core.agents", "hems_core.utils"]

[tool.setuptools.package-data]
hems_core = ["configs/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
